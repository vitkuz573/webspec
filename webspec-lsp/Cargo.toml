[package]
name = "webspec-lsp"
version = "0.1.0"
edition = "2021"
description = "Language server for webspec YAML files"
license = "MIT"
repository = "https://github.com/vitkuz573/webspec"
authors = ["Vitaly Kuzyaev <vitkuz573@gmail.com>"]

[dependencies]
webspec = { path = ".." }
tower-lsp = { version = "0.20", features = ["runtime-tokio"] }
lsp-types = "0.94"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
serde_json = "1"
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }
url = "2"
dashmap = "5.5"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
