openapi: "3.1.0"
info:
  title: "Minimal Example API"
  version: "1.0.0"
servers:
  - url: "https://example.com"
paths:
  /items:
    get:
      operationId: listItems
      summary: "List items"
      responses:
        "200":
          description: "A list of items"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
components:
  schemas:
    Item:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
