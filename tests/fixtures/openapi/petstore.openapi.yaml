openapi: "3.1.0"
info:
  title: "Swagger Petstore"
  description: "A sample API that uses a petstore as an example"
  version: "1.0.0"
  license:
    name: "MIT"
servers:
  - url: "https://petstore.example.com/v1"
paths:
  /pets:
    get:
      operationId: listPets
      summary: "List all pets"
      responses:
        "200":
          description: "A paged array of pets"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      summary: "Create a pet"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "201":
          description: "Null response"
  /pets/{petId}:
    get:
      operationId: showPetById
      summary: "Info for a specific pet"
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Expected response to a valid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
          nullable: true
