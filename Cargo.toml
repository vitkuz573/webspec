[package]
name = "webspec"
version = "0.1.0"
edition = "2021"
description = "Universal spec-to-code generator for web scraping SDKs"
license = "MIT"
repository = "https://github.com/vitkuz573/webspec"
authors = ["Vitaly Kuzyaev <vitkuz573@gmail.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
miette = { version = "7.6", features = ["fancy"] }
jsonschema = "0.49"
notify = "7"
colored = "2"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
regex = "1"
scraper = "0.22"
url = "2"
which = "8.0.5"
tempfile = "3"

[[bin]]
name = "webspec-mock"
path = "tests/fixtures/plugins/mock_generator.rs"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
