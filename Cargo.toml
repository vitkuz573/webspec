[package]
name = "specgen"
version = "0.1.0"
edition = "2021"
description = "Universal spec-to-code generator for API SDKs"
license = "MIT"
repository = "https://github.com/vitkuz573/specgen"
authors = ["Vitaly Kuzyaev <vitkuz573@gmail.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
